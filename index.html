<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Traktor Stem Forge</title>
<style>
:root{--bg:#0f1115;--card:#1a1e26;--ok:#3ecf6a;--txt:#e8eaf0;--dim:#8b93a3;--acc:#5b8cff}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:22px}
h1{font-size:22px;margin:0 0 6px} .sub{color:var(--dim);margin:0 0 18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input[type=text],select{background:var(--card);border:1px solid #2a3040;color:var(--txt);border-radius:8px;padding:9px 12px;font-size:14px}
#out{flex:1;min-width:200px}
button{background:var(--acc);border:0;color:#fff;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
button.ghost{background:#2a3040} button.go{background:var(--ok);font-weight:700;padding:12px 22px}
.stats{display:flex;gap:18px;color:var(--dim);margin:8px 0 12px} .stats b{color:var(--txt)}
.bulk{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.tbl{background:var(--card);border-radius:10px;overflow:auto;max-height:52vh;border:1px solid #2a3040}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:#22262f;text-align:left;padding:8px 10px;font-size:13px;color:var(--dim);font-weight:600}
td{padding:8px 12px;border-top:1px solid #262c38;cursor:pointer;user-select:none}
tr.sel td{background:rgba(91,140,255,.16)}
tr.done td{color:var(--dim)} tr.done .st{color:var(--ok)}
.st{font-size:12px} .dir{color:var(--dim);font-size:12px}
.log{background:#12151b;border:1px solid #2a3040;border-radius:10px;margin-top:14px;padding:10px;max-height:240px;overflow:auto;white-space:pre-wrap;font:12.5px/1.5 Consolas,monospace;color:#c9d2e3}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;background:#22262f;color:var(--dim);font-size:12px}
.hint{color:var(--dim);font-size:13px;margin:2px 0 0}
</style></head>
<body><div class="wrap">
<h1>Traktor Stem Forge</h1>
<p class="sub">Sélectionne 1 fichier, 20 ou tout un dossier dans la fenêtre Windows. Clic sur une ligne = coche/décoche.</p>
<div class="bar">
  <button class="go" onclick="pick()">📂 Sélectionner des fichiers…</button>
  <span class="hint">dans la fenêtre Windows : Ctrl+clic pour en prendre plusieurs, Ctrl+A pour tout</span>
</div>
<div class="bar">
  <input type="text" id="out" placeholder="Sortie (vide = sous-dossier stems du dossier source)">
  <select id="model"><option value="htdemucs">htdemucs — rapide (20 s)</option><option value="htdemucs_ft">htdemucs_ft — qualité, moins de bleed (40 s)</option></select>
  <select id="shifts"><option value="1">1 passage (recommandé)</option><option value="0">0 (turbo)</option><option value="2">2 (défaut Demucs)</option></select>
  <select id="workers"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select>
  <span class="chip" id="device"></span>
</div>
<div class="stats">Fichiers: <b id="ntot">0</b> · Sélectionnés: <b id="nsel">0</b> · Déjà Stem: <b id="ndone">0</b></div>
<div class="bulk">
  <button class="ghost" onclick="bulk('all')">Tout</button>
  <button class="ghost" onclick="bulk('none')">Aucun</button>
  <button class="ghost" onclick="bulk('todo')">Seulement restants</button>
  <button class="ghost" onclick="bulk('inv')">Inverser</button>
  <input type="text" id="q" placeholder="Filtrer par nom…" oninput="bulk('filter')" style="min-width:160px">
  <button class="go" onclick="launch()">🚀 Convertir la sélection</button>
  <button class="ghost" onclick="stopB()">⏸ Stop</button>
</div>
<div class="tbl"><table><thead><tr><th>Fichier</th><th>Dossier</th><th>Taille</th><th>Statut</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="log" id="log">Prêt.</div>
</div>
<script>
let rows=[], sel=new Set(), timer=null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(){
  const tb=$('tb'); tb.innerHTML='';
  for(const r of rows){
    const tr=document.createElement('tr');
    if(sel.has(r.file)) tr.className='sel';
    if(r.status==='done') tr.classList.add('done');
    const d=r.dir.split('\\').pop()||r.dir;
    tr.innerHTML=`<td>${esc(r.name)}</td><td class="dir">${esc(d)}</td><td>${r.size}</td>`+
      `<td class="st">${r.status==='done'?'✔ déjà Stem':'⬜ à faire'}</td>`;
    tr.onclick=()=>{
      if(r.status==='done' && !ev_ctrl) return;
      sel.has(r.file)?sel.delete(r.file):sel.add(r.file);
      draw(); };
    tb.appendChild(tr);
  }
  $('ntot').textContent=rows.length; $('nsel').textContent=sel.size;
  $('ndone').textContent=rows.filter(r=>r.status==='done').length;
}
let ev_ctrl=false;
document.addEventListener('keydown',e=>{ev_ctrl=e.ctrlKey});
async function pick(){
  $('log').textContent='📂 Fenêtre Windows ouverte — 1 fichier, Ctrl=clic multiple, Ctrl+A=tout…';
  const r=await fetch('/dialog').then(x=>x.json()).catch(e=>({paths:[]}));
  if(!r.paths || !r.paths.length){ $('log').textContent='Aucun fichier choisi.'; return; }
  const rr=await fetch('/api/scanpaths?p='+encodeURIComponent(r.paths.join('|'))).then(x=>x.json());
  rows=rr.files; sel=new Set(rows.map(x=>x.file));
  $('log').textContent=rows.length+' fichier(s) chargé(s) — tous cochés.';
  draw();
}
function bulk(m){
  if(m==='all') for(const r of rows) sel.add(r.file);
  else if(m==='none') sel.clear();
  else if(m==='todo'){ sel.clear(); for(const r of rows) if(r.status!=='done') sel.add(r.file); }
  else if(m==='inv') for(const r of rows) sel.has(r.file)?sel.delete(r.file):sel.add(r.file);
  else if(m==='filter'){ const q=$('q').value.trim().toLowerCase(); for(const r of rows) if(q && r.name.toLowerCase().includes(q)) sel.add(r.file); }
  draw();
}
function selList(){ const out=[]; for(const r of rows) if(sel.has(r.file)) out.push(r.file); return out; }
async function launch(){
  const sel=selList(); if(!sel.length){ $('log').textContent='⚠ Aucun fichier sélectionné'; return; }
  const body={'selectedFull':sel,'model':$('model').value,'shifts':+$('shifts').value,'workers':+$('workers').value};
  const r=await fetch('/api/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(x=>x.json());
  if(!r.ok){ $('log').textContent='⚠ '+r.msg; return; }
  if(timer) clearInterval(timer);
  $('log').textContent='🚀 Lancement…\n';
  timer=setInterval(pollApi,2000); pollApi();
}
async function stopB(){ await fetch('/api/stop',{method:'POST'}); }
async function pollApi(){
  const r=await fetch('/api/poll').then(x=>x.json());
  if(r.device) $('device').textContent=r.device;
  $('log').textContent=r.log.length?r.log.join('\n'):'(pas encore de log)';
  $('log').scrollTop=$('log').scrollHeight;
  if(!r.running && timer){ clearInterval(timer); timer=null; $('log').textContent+='\n— batch terminé —'; }
}
pollApi();
</script></body></html>
