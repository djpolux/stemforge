<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Stem Forge</title>
<style>
:root{--bg:#0f1115;--card:#1a1e26;--ok:#3ecf6a;--txt:#e8eaf0;--dim:#8b93a3;--acc:#5b8cff}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:22px}
h1{font-size:22px;margin:0 0 6px} .sub{color:var(--dim);margin:0 0 18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input[type=text],select{background:var(--card);border:1px solid #2a3040;color:var(--txt);border-radius:8px;padding:9px 12px;font-size:14px}
#out{flex:1;min-width:200px}
button{background:var(--acc);border:0;color:#fff;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
button.ghost{background:#2a3040} button.go{background:var(--ok);font-weight:700;padding:12px 22px}
#lang{background:transparent;border-color:#2a3040;color:var(--dim);font:700 13px system-ui}
.stats{display:flex;gap:18px;color:var(--dim);margin:8px 0 12px} .stats b{color:var(--txt)}
.bulk{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.tbl{background:var(--card);border-radius:10px;overflow:auto;max-height:52vh;border:1px solid #2a3040}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:#22262f;text-align:left;padding:8px 10px;font-size:13px;color:var(--dim);font-weight:600}
td{padding:8px 12px;border-top:1px solid #262c38;cursor:pointer;user-select:none}
tr.sel td{background:rgba(91,140,255,.16)}
tr.done td{color:var(--dim)} tr.done .st{color:var(--ok)}
.st{font-size:12px} .dir{color:var(--dim);font-size:12px}
.log{background:#12151b;border:1px solid #2a3040;border-radius:10px;margin-top:14px;padding:10px;max-height:240px;overflow:auto;white-space:pre-wrap;font:12.5px/1.5 Consolas,monospace;color:#c9d2e3}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;background:#22262f;color:var(--dim);font-size:12px}
.hint{color:var(--dim);font-size:13px;margin:2px 0 0}
</style></head>
<body><div class="wrap">
<div class="bar"><h1 style="flex:1">Stem Forge</h1><select id="lang"><option value="fr">Français</option><option value="en">English</option></select></div>
<p class="sub" id="sub"></p>
<div class="bar">
  <button class="go" id="pick">📂 <span data-t="pick"></span></button>
  <span class="hint" id="hint"></span>
</div>
<div class="bar">
  <input type="text" id="out" data-ph="outPh">
  <select id="model">
    <option value="htdemucs"></option>
    <option value="htdemucs_ft"></option>
  </select>
  <select id="shifts"><option value="1"></option><option value="0"></option><option value="2"></option></select>
  <select id="workers"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select>
  <span class="chip" id="device"></span>
</div>
<div class="stats"><span data-t="stFiles"> </span> <b id="ntot">0</b> · <span data-t="stSel"></span> <b id="nsel">0</b> · <span data-t="stDone"></span> <b id="ndone">0</b></div>
<div class="bulk">
  <button class="ghost" id="bAll"></button>
  <button class="ghost" id="bNone"></button>
  <button class="ghost" id="bTodo"></button>
  <button class="ghost" id="bInv"></button>
  <input type="text" id="q" data-ph="filter" oninput="bulk('filter')" style="min-width:160px">
  <button class="go" id="go">🚀 <span data-t="go"></span></button>
  <button class="ghost" id="stop">⏸ <span data-t="stop"></span></button>
</div>
<div class="tbl"><table><thead><tr><th id="thF"></th><th id="thD"></th><th id="thS"></th><th id="thT"></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="log" id="log"></div>
</div>
<script>
let rows=[], sel=new Set(), timer=null, LANG='fr';
const I18N={
 fr:{sub:"Sélectionne 1 fichier, 20 ou tout un dossier dans la fenêtre Windows. Clic sur une ligne = coche/décoche. Produit des stems 5 pistes lus nativement par Traktor Pro 4.",
   pick:"Sélectionner des fichiers…", hint:"dans la fenêtre Windows : Ctrl+clic pour en prendre plusieurs, Ctrl+A pour tout",
   outPh:"Sortie (vide = sous-dossier stems du dossier source)",
   mod0:"htdemucs — rapide (20 s)", mod1:"htdemucs_ft — qualité, moins de bleed (40 s)",
   sh0:"1 passage (recommandé)", sh1:"0 (turbo)", sh2:"2 (défaut Demucs)",
   stFiles:"Fichiers:", stSel:"Sélectionnés:", stDone:"Déjà Stem:",
   bAll:"Tout", bNone:"Aucun", bTodo:"Seulement restants", bInv:"Inverser", filter:"Filtrer par nom…",
   go:"Convertir la sélection", stop:"Stop",
   thF:"Fichier", thD:"Dossier", thS:"Taille", thT:"Statut",
   done:"✔ déjà Stem", todo:"⬜ à faire", ready:"Prêt.",
   opened:"📂 Fenêtre Windows ouverte — 1 fichier, Ctrl+clic multiple, Ctrl+A=tout…", none0:"Aucun fichier choisi.",
   loaded:f=>f+" fichier(s) chargé(s) — tous cochés.",
   noSel:"⚠ Aucun fichier sélectionné", launching:"🚀 Lancement…",
   finished:"\n— batch terminé —", readyLog:"(pas encore de log)"},
 en:{sub:"Pick 1 file, 20, or a whole folder in the Windows dialog. Click a row to check/uncheck it. Produces 5-track stem files natively read by Traktor Pro 4.",
   pick:"Select files…", hint:"in the Windows dialog: Ctrl+click to pick several, Ctrl+A for all",
   outPh:"Output (empty = stems subfolder next to the sources)",
   mod0:"htdemucs — fast (20 s)", mod1:"htdemucs_ft — quality, less bleed (40 s)",
   sh0:"1 pass (recommended)", sh1:"0 (turbo)", sh2:"2 (Demucs default)",
   stFiles:"Files:", stSel:"Selected:", stDone:"Already stems:",
   bAll:"All", bNone:"None", bTodo:"Only remaining", bInv:"Invert", filter:"Filter by name…",
   go:"Convert selection", stop:"Stop",
   thF:"File", thD:"Folder", thS:"Size", thT:"Status",
   done:"✔ already a stem", todo:"⬜ to convert", ready:"Ready.",
   opened:"📂 Windows dialog open — 1 file, Ctrl+click multiple, Ctrl+A=all…", none0:"No file selected.",
   loaded:f=>f+" file(s) loaded — all checked.",
   noSel:"⚠ No file selected", launching:"🚀 Launching…",
   finished:"\n— batch finished —", readyLog:"(no log yet)"}
};
function T(key){return I18N[LANG][key]}
let ev_ctrl=false;
document.addEventListener('keydown',e=>{ev_ctrl=e.ctrlKey});
function applyLang(){
  const d=I18N[LANG];
  document.documentElement.lang=LANG;
  document.getElementById('sub').textContent=d.sub;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=d[el.dataset.t]);
  document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=d[el.dataset.ph]);
  document.getElementById('model').options[0].textContent=d.mod0;
  document.getElementById('model').options[1].textContent=d.mod1;
  const sh=document.getElementById('shifts');
  sh.options[0].textContent=d.sh0; sh.options[1].textContent=d.sh1; sh.options[2].textContent=d.sh2;
  ['bAll','bNone','bTodo','bInv','go','stop'].forEach(id=>{
    const span=document.getElementById(id).querySelector('span');
    if(span) span.textContent=d[{'bAll':'bAll','bNone':'bNone','bTodo':'bTodo','bInv':'bInv','go':'go','stop':'stop'}[id]];
    else document.getElementById(id).textContent=d[{'bAll':'bAll','bNone':'bNone','bTodo':'bTodo','bInv':'bInv','go':'go','stop':'stop'}[id]];
  });
  ['thF','thD','thS','thT'].forEach(id=>document.getElementById(id).textContent=d[id]);
  if(!document.getElementById('log').textContent.includes('🚀') && !document.getElementById('log').textContent.includes('⚠'))
    document.getElementById('log').textContent=d.readyLog;
  localStorage.setItem('sf_lang', LANG);
  draw();
}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(){
  const tb=$('tb'); tb.innerHTML='';
  for(const r of rows){
    const tr=document.createElement('tr');
    if(sel.has(r.file)) tr.className='sel';
    if(r.status==='done') tr.classList.add('done');
    const d=r.dir.split('\\').pop()||r.dir;
    tr.innerHTML=`<td>${esc(r.name)}</td><td class="dir">${esc(d)}</td><td>${r.size}</td>`+
      `<td class="st">${r.status==='done'?T('done'):T('todo')}</td>`;
    tr.onclick=()=>{ if(r.status==='done'&&!ev_ctrl) return;
      sel.has(r.file)?sel.delete(r.file):sel.add(r.file); draw(); };
    tb.appendChild(tr);
  }
  $('ntot').textContent=rows.length; $('nsel').textContent=sel.size;
  $('ndone').textContent=rows.filter(r=>r.status==='done').length;
}
async function pick(){
  $('log').textContent=T('opened');
  const r=await fetch('/dialog').then(x=>x.json()).catch(e=>({paths:[]}));
  if(!r.paths || !r.paths.length){ $('log').textContent=T('none0'); return; }
  const rr=await fetch('/api/scanpaths?p='+encodeURIComponent(r.paths.join('|'))).then(x=>x.json());
  rows=rr.files; sel=new Set(rows.map(x=>x.file));
  $('log').textContent=T('loaded')(rows.length);
  draw();
}
function bulk(m){
  if(m==='all') for(const r of rows) sel.add(r.file);
  else if(m==='none') sel.clear();
  else if(m==='todo'){ sel.clear(); for(const r of rows) if(r.status!=='done') sel.add(r.file); }
  else if(m==='inv') for(const r of rows) sel.has(r.file)?sel.delete(r.file):sel.add(r.file);
  else if(m==='filter'){ const q=$('q').value.trim().toLowerCase(); for(const r of rows) if(q && r.name.toLowerCase().includes(q)) sel.add(r.file); }
  draw();
}
function selList(){ const out=[]; for(const r of rows) if(sel.has(r.file)) out.push(r.file); return out; }
async function launch(){
  const sl=selList(); if(!sl.length){ $('log').textContent=T('noSel'); return; }
  const body={'selectedFull':sl,'model':$('model').value,'shifts':+$('shifts').value,'workers':+$('workers').value};
  const r=await fetch('/api/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(x=>x.json());
  if(!r.ok){ $('log').textContent='⚠ '+r.msg; return; }
  if(timer) clearInterval(timer);
  $('log').textContent=T('launching')+'\n';
  timer=setInterval(pollApi,2000); pollApi();
}
async function stopB(){ await fetch('/api/stop',{method:'POST'}); }
async function pollApi(){
  const r=await fetch('/api/poll').then(x=>x.json());
  if(r.device) $('device').textContent=r.device;
  $('log').textContent=r.log.length?r.log.join('\n'):$(('log')).textContent||T('readyLog');
  $('log').scrollTop=$('log').scrollHeight;
  if(!r.running && timer){ clearInterval(timer); timer=null; $('log').textContent+=T('finished'); }
}
document.getElementById('lang').addEventListener('change',e=>{LANG=e.target.value; applyLang();});
LANG=localStorage.getItem('sf_lang')||'fr';
document.getElementById('lang').value=LANG;
applyLang();
pollApi();
</script></body></html>
